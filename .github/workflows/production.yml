name: Deploy Production to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.PROD_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.PROD_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build project
        run: vercel build --prod --token=${{ secrets.PROD_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.PROD_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Override git author for Vercel
        run: |
          git config user.name "Z Tech Dental Lab"
          git config user.email "ztechdentallab@gmail.com"
          git commit --amend --reset-author --no-edit

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.PROD_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.PROD_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}
