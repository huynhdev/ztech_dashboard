name: Deploy Staging to Vercel

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.STAG_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.STAG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STAG_VERCEL_PROJECT_ID }}

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build project
        run: vercel build --prod --token=${{ secrets.STAG_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.STAG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STAG_VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.STAG_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.STAG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STAG_VERCEL_PROJECT_ID }}
